# Each service in its own container, talking over Redis, storing in TimescaleDB.
#   cp .env.example .env   # fill in the provider key, set FOREX_DB_URL / FOREX_REDIS_URL below
#   docker compose up --build
# The app is then on http://localhost:8000
x-app: &app
  build: { context: .., dockerfile: forex-app/Dockerfile }
  env_file: .env
  environment:
    FOREX_DB_URL: postgresql://forex:forex@db:5432/forex
    FOREX_REDIS_URL: redis://redis:6379/0
  depends_on: [db, redis]
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment: { POSTGRES_USER: forex, POSTGRES_PASSWORD: forex, POSTGRES_DB: forex }
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

  feed:
    <<: *app
    command: ["python", "-m", "forexapp.run", "feed"]

  strategy:
    <<: *app
    command: ["python", "-m", "forexapp.run", "strategy"]

  api:
    <<: *app
    command: ["python", "-m", "forexapp.run", "api"]
    ports: ["8000:8000"]

  model:
    build: { context: .., dockerfile: forex-app/Dockerfile.model }
    env_file: .env
    environment:
      FOREX_DB_URL: postgresql://forex:forex@db:5432/forex
      FOREX_REDIS_URL: redis://redis:6379/0
    volumes: [hfcache:/srv/hf-cache, ./models:/srv/kronos/forex-app/models]
    depends_on: [db, redis]
    restart: unless-stopped
    # GPU: uncomment on a host with the NVIDIA container toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  pgdata:
  hfcache:
