<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* matches the app: black canvas, white and grey candles, colour only for the trade's levels */
  :root { --bg: #151516; --text: #8a8a90; --grid: #1f1f22; --up: #e8e8ea; --down: #4a4a50; --wick: #8a8a90;
          --entry: #8ab4ff; --stop: #f0616d; --target: #3dd68c; --band: #b8b8c0; --range: #8a8a90; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font: 12px -apple-system, system-ui, sans-serif; }
  #chart { position: absolute; inset: 0; }
  #legend { position: absolute; left: 14px; top: 12px; z-index: 5; color: var(--text); font: 12px ui-monospace, Menlo, monospace;
            pointer-events: none; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text);
           font: 600 15px ui-rounded, -apple-system, system-ui, sans-serif; }
  #tools { position: absolute; left: 10px; top: 34px; z-index: 6; display: flex; flex-direction: column; gap: 4px;
           padding: 4px; border-radius: 9px; background: rgba(29,29,31,.92); border: 1px solid rgba(255,255,255,.08); }
  #tools button { width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #8a8a90;
                  display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .12s, color .12s; }
  #tools button:hover { background: rgba(255,255,255,.08); color: #f2f2f3; }
  #tools button.on { background: #f2f2f3; color: #0e0e0f; }
  #tools hr { border: 0; height: 1px; background: rgba(255,255,255,.08); margin: 2px 2px; }
  #tools svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; }
  body.drawing #chart { cursor: crosshair; }
</style>
</head>
<body>
<div id="chart"></div>
<div id="legend"></div>
<div id="tools" role="toolbar" aria-label="Drawing tools">
  <button data-tool="cursor" class="on" title="Select (click a drawing; Delete removes it)"><svg viewBox="0 0 16 16"><path d="M3 2l9 5-4 1-2 4z"/></svg></button>
  <button data-tool="hline" title="Horizontal line (one click)"><svg viewBox="0 0 16 16"><path d="M1 8h14"/><circle cx="8" cy="8" r="1.5"/></svg></button>
  <button data-tool="trend" title="Trend line (two clicks)"><svg viewBox="0 0 16 16"><path d="M2 13L14 3"/><circle cx="2.5" cy="12.5" r="1.4"/><circle cx="13.5" cy="3.5" r="1.4"/></svg></button>
  <button data-tool="rect" title="Zone / rectangle (two clicks)"><svg viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="8" rx="1"/></svg></button>
  <hr>
  <button data-act="delete" title="Delete the selected drawing"><svg viewBox="0 0 16 16"><path d="M3 4h10M6 4V2.5h4V4M4.5 4l.7 9.5h5.6l.7-9.5"/></svg></button>
  <button data-act="clear" title="Clear all drawings on this pair"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
</div>
<div id="empty">Waiting for prices from the engine…</div>
<script src="lightweight-charts.standalone.production.js"></script>
<script>
"use strict";
// The Mac app drives this page through window.fx.*; it never loads anything from the internet.
const LW = window.LightweightCharts;
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function rgba(hex, a) { const n = parseInt(hex.replace("#", ""), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }

class Overlay {   // forecast band, session ranges and the trade's profit/loss zones, under the candles
  constructor() { this.band = []; this.ranges = []; this.zones = null; }
  attached(p) { this.chart = p.chart; this.series = p.series; this.req = p.requestUpdate; }
  detached() { this.chart = null; }
  refresh() { this.req && this.req(); }
  updateAllViews() {}
  paneViews() {
    const self = this;
    return [{ zOrder: () => "bottom", renderer: () => ({ draw(target) {
      if (!self.chart) return;
      const ts = self.chart.timeScale(), s = self.series;
      target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
        const x = (t) => ts.timeToCoordinate(t), y = (p) => s.priceToCoordinate(p);
        for (const r of self.ranges) {
          const x1 = x(r.start); let x2 = x(r.end); const y1 = y(r.high), y2 = y(r.low);
          if (x1 === null || y1 === null || y2 === null) continue;
          if (x2 === null) x2 = mediaSize.width;
          ctx.fillStyle = rgba(css("--range"), 0.12); ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
          ctx.setLineDash([4, 3]); ctx.strokeStyle = rgba(css("--range"), 0.8); ctx.strokeRect(x1 + .5, y1 + .5, x2 - x1 - 1, y2 - y1 - 1);
          ctx.setLineDash([]); ctx.fillStyle = css("--range"); ctx.font = "600 11px ui-rounded, -apple-system, sans-serif"; ctx.fillText(r.label, x1 + 3, y1 - 5);
        }
        const z = self.zones;
        if (z) {
          let x1 = x(z.start); let x2 = z.end ? x(z.end) : null;
          if (x1 === null) x1 = 0;
          if (x2 === null) x2 = mediaSize.width;
          const ye = y(z.entry), ys = y(z.stop), yt = y(z.target);
          if (ye !== null && ys !== null && yt !== null) {
            ctx.fillStyle = rgba(css("--target"), 0.16); ctx.fillRect(x1, Math.min(ye, yt), x2 - x1, Math.abs(yt - ye));
            ctx.fillStyle = rgba(css("--stop"), 0.16); ctx.fillRect(x1, Math.min(ye, ys), x2 - x1, Math.abs(ys - ye));
          }
        }
        const top = [], bot = [];
        for (const p of self.band) { const xx = x(p.t), a = y(p.p90), b = y(p.p10); if (xx === null || a === null || b === null) continue; top.push([xx, a]); bot.push([xx, b]); }
        if (top.length > 1) {
          ctx.beginPath(); top.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b));
          for (let i = bot.length - 1; i >= 0; i--) ctx.lineTo(bot[i][0], bot[i][1]);
          ctx.closePath(); ctx.fillStyle = rgba(css("--band"), 0.16); ctx.fill();
        }
      });
    } }) }];
  }
}

const chart = LW.createChart(document.getElementById("chart"), {
  autoSize: true, layout: { attributionLogo: true, fontSize: 11 },
  rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false, timeVisible: true, secondsVisible: false, rightOffset: 6,
    barSpacing: 7, minBarSpacing: 3 },
  crosshair: { mode: LW.CrosshairMode.Normal },
  localization: { timeFormatter: (t) => new Date(t * 1000).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }) },
});
const candles = chart.addCandlestickSeries({ priceLineVisible: true });
const median = chart.addLineSeries({ lineWidth: 2, lineStyle: LW.LineStyle.Dashed, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
const overlay = new Overlay();
candles.attachPrimitive(overlay);
let bars = [], digits = 5, priceLines = [], medianCount = 0;

function theme() {
  chart.applyOptions({ layout: { background: { type: "solid", color: css("--bg") }, textColor: css("--text") },
    grid: { vertLines: { color: css("--grid") }, horzLines: { color: css("--grid") } } });
  candles.applyOptions({ upColor: css("--up"), downColor: css("--down"), borderUpColor: css("--up"), borderDownColor: css("--down"),
    wickUpColor: css("--wick"), wickDownColor: css("--wick") });
  median.applyOptions({ color: css("--band") });
  overlay.refresh();
}
theme();

chart.subscribeCrosshairMove((p) => {
  const b = p && p.time !== undefined && p.seriesData ? p.seriesData.get(candles) : bars[bars.length - 1];
  document.getElementById("legend").textContent = b && b.open !== undefined
    ? `O ${b.open.toFixed(digits)}  H ${b.high.toFixed(digits)}  L ${b.low.toFixed(digits)}  C ${b.close.toFixed(digits)}` : "";
});

// ---------------------------------------------------------------- time <-> x on any timeframe
let tfSec = 300;
function logicalOf(t) {                       // a time to a (fractional) bar index; works between bars and in the future
  if (!bars.length) return null;
  const last = bars.length - 1;
  if (t >= bars[last].time) return last + (t - bars[last].time) / tfSec;
  if (t <= bars[0].time) return (t - bars[0].time) / tfSec;
  let lo = 0, hi = last;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (bars[m].time <= t) lo = m; else hi = m; }
  return lo + Math.min(1, (t - bars[lo].time) / tfSec);
}
function xOf(t) { const l = logicalOf(t); return l === null ? null : chart.timeScale().logicalToCoordinate(l); }
function timeAt(x) {
  const l = chart.timeScale().coordinateToLogical(x);
  if (l === null || !bars.length) return null;
  const last = bars.length - 1, i = Math.max(0, Math.min(last, Math.floor(l)));
  return Math.round(bars[i].time + (l - i) * tfSec);
}

// ---------------------------------------------------------------- drawings (kept per pair by the app)
let drawings = [], tool = "cursor", pending = null, hover = null, selected = null;
class DrawLayer {
  attached(p) { this.chart = p.chart; this.req = p.requestUpdate; }
  detached() { this.chart = null; }
  refresh() { this.req && this.req(); }
  updateAllViews() {}
  paneViews() {
    return [{ zOrder: () => "top", renderer: () => ({ draw(target) {
      target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
        const all = pending && hover ? drawings.concat([{ ...pending, p2: hover, preview: true }]) : drawings;
        for (const d of all) {
          const sel = d.id === selected;
          ctx.strokeStyle = d.preview ? "rgba(242,242,243,.55)" : (sel ? "#ffffff" : "rgba(242,242,243,.8)");
          ctx.lineWidth = sel ? 2 : 1.4;
          ctx.setLineDash(d.preview ? [5, 4] : []);
          const y1 = candles.priceToCoordinate(d.p1.price);
          if (y1 === null) continue;
          if (d.type === "hline") {
            ctx.beginPath(); ctx.moveTo(0, y1); ctx.lineTo(mediaSize.width, y1); ctx.stroke();
            ctx.fillStyle = "rgba(242,242,243,.85)"; ctx.font = "11px -apple-system, sans-serif";
            ctx.fillText(d.p1.price.toFixed(digits), 8, y1 - 4);
            continue;
          }
          if (!d.p2) continue;
          const x1 = xOf(d.p1.t), x2 = xOf(d.p2.t), y2 = candles.priceToCoordinate(d.p2.price);
          if (x1 === null || x2 === null || y2 === null) continue;
          if (d.type === "trend") {
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
          } else if (d.type === "rect") {
            ctx.fillStyle = "rgba(242,242,243,.06)";
            ctx.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
            ctx.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
          }
          if (sel) for (const [x, y] of [[x1, y1], [x2, y2]]) { ctx.fillStyle = "#fff"; ctx.fillRect(x - 3, y - 3, 6, 6); }
        }
        ctx.setLineDash([]);
      });
    } }) }];
  }
}
const drawLayer = new DrawLayer();

function saveDrawings() {
  const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.fxDrawings;
  if (h) h.postMessage(JSON.stringify(drawings));
}
function pointAt(p) {
  if (!p || !p.point) return null;
  const price = candles.coordinateToPrice(p.point.y), t = timeAt(p.point.x);
  return price === null || t === null ? null : { t, price };
}
function distTo(d, x, y) {                    // pixels from (x, y) to a drawing, for selecting it
  const y1 = candles.priceToCoordinate(d.p1.price);
  if (y1 === null) return 1e9;
  if (d.type === "hline") return Math.abs(y - y1);
  const x1 = xOf(d.p1.t), x2 = xOf(d.p2.t), y2 = candles.priceToCoordinate(d.p2.price);
  if (x1 === null || x2 === null || y2 === null) return 1e9;
  if (d.type === "rect") {
    const inX = x >= Math.min(x1, x2) - 4 && x <= Math.max(x1, x2) + 4, inY = y >= Math.min(y1, y2) - 4 && y <= Math.max(y1, y2) + 4;
    return inX && inY ? 0 : 1e9;
  }
  const dx = x2 - x1, dy = y2 - y1, len = dx * dx + dy * dy || 1;
  const k = Math.max(0, Math.min(1, ((x - x1) * dx + (y - y1) * dy) / len));
  return Math.hypot(x - (x1 + k * dx), y - (y1 + k * dy));
}
function setTool(t) {
  tool = t; pending = null; hover = null;
  document.querySelectorAll("#tools button[data-tool]").forEach((b) => b.classList.toggle("on", b.dataset.tool === t));
  document.body.classList.toggle("drawing", t !== "cursor");
  chart.applyOptions({ handleScroll: t === "cursor", handleScale: t === "cursor" });
  drawLayer.refresh();
}
document.getElementById("tools").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.tool) setTool(b.dataset.tool);
  if (b.dataset.act === "delete" && selected) { drawings = drawings.filter((d) => d.id !== selected); selected = null; saveDrawings(); drawLayer.refresh(); }
  if (b.dataset.act === "clear" && drawings.length) { drawings = []; selected = null; saveDrawings(); drawLayer.refresh(); }
});
function onChartClick(p) {
  const pt = pointAt(p);
  if (tool === "cursor") {
    if (!p.point) return;
    let best = null, bd = 7;
    for (const d of drawings) { const dd = distTo(d, p.point.x, p.point.y); if (dd < bd) { bd = dd; best = d.id; } }
    selected = best; drawLayer.refresh();
    return;
  }
  if (!pt) return;
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  if (tool === "hline") { drawings.push({ id, type: "hline", p1: pt }); saveDrawings(); setTool("cursor"); return; }
  if (!pending) { pending = { id, type: tool, p1: pt }; hover = pt; drawLayer.refresh(); return; }
  drawings.push({ ...pending, p2: pt }); pending = null; hover = null; saveDrawings(); setTool("cursor");
}
// read clicks straight from the mouse: the chart library drops a quick second click
const chartEl = document.getElementById("chart");
let downAt = null;
chartEl.addEventListener("pointerdown", (e) => { downAt = { x: e.clientX, y: e.clientY }; }, true);
chartEl.addEventListener("pointerup", (e) => {
  const d = downAt;
  downAt = null;
  if (!d || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 4) return;       // a drag, not a click
  const r = chartEl.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (x > chart.timeScale().width()) return;                                // on the price scale
  onChartClick({ point: { x, y } });
}, true);
chart.subscribeCrosshairMove((p) => { if (pending) { const pt = pointAt(p); if (pt) { hover = pt; drawLayer.refresh(); } } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { setTool("cursor"); selected = null; drawLayer.refresh(); }
  if ((e.key === "Delete" || e.key === "Backspace") && selected) {
    drawings = drawings.filter((d) => d.id !== selected); selected = null; saveDrawings(); drawLayer.refresh();
  }
});

// ---------------------------------------------------------------- signal markers
let markerList = [];
function applyMarkers() {
  if (!bars.length) { candles.setMarkers([]); return; }
  const out = [];
  for (const m of markerList) {
    const l = logicalOf(m.time);
    if (l === null || l < 0) continue;
    const i = Math.min(bars.length - 1, Math.floor(l));
    out.push({ time: bars[i].time, position: m.side === "buy" ? "belowBar" : "aboveBar",
               color: m.side === "buy" ? css("--target") : css("--stop"),
               shape: m.side === "buy" ? "arrowUp" : "arrowDown", text: m.text || "" });
  }
  out.sort((a, b) => a.time - b.time);
  candles.setMarkers(out);
}

window.fx = {
  setInstrument(d) {
    digits = d;
    const f = { type: "price", precision: d, minMove: Math.pow(10, -d) };
    candles.applyOptions({ priceFormat: f }); median.applyOptions({ priceFormat: f });
  },
  setCandles(rows) {                          // [[time, open, high, low, close], ...]
    bars = rows.map((r) => ({ time: r[0], open: r[1], high: r[2], low: r[3], close: r[4] }));
    candles.setData(bars);
    let step = 0;                               // the timeframe: the smallest gap between candles
    for (let i = 1; i < Math.min(bars.length, 60); i++) { const d = bars[i].time - bars[i - 1].time; if (d > 0 && (!step || d < step)) step = d; }
    if (step) tfSec = step;
    applyMarkers(); drawLayer.refresh();
    document.getElementById("empty").style.display = bars.length ? "none" : "grid";
    const n = bars.length + medianCount;
    // always show about 150 bars' width, even with fewer candles: they keep their normal size and spacing
    chart.timeScale().setVisibleLogicalRange({ from: n - 150, to: n + 4 });
  },
  updateCandle(r) {                           // a closed candle, or the forming one
    const b = { time: r[0], open: r[1], high: r[2], low: r[3], close: r[4] };
    const last = bars[bars.length - 1];
    if (last && b.time < last.time) return;
    if (last && last.time === b.time) bars[bars.length - 1] = b; else bars.push(b);
    candles.update(b);
  },
  tick(time, price, tfSec) {
    const t = Math.floor(time / tfSec) * tfSec, last = bars[bars.length - 1];
    if (!last || t < last.time) return;
    const b = t > last.time ? { time: t, open: price, high: price, low: price, close: price }
      : { ...last, high: Math.max(last.high, price), low: Math.min(last.low, price), close: price };
    if (t > last.time) bars.push(b); else bars[bars.length - 1] = b;
    candles.update(b);
  },
  setForecast(f) {                            // {baseTime, lastClose, band: [{t, p10, p50, p90}]} or null
    if (!f || !f.band || !f.band.length) { overlay.band = []; medianCount = 0; median.setData([]); overlay.refresh(); return; }
    const pts = [{ t: f.baseTime, p10: f.lastClose, p50: f.lastClose, p90: f.lastClose }, ...f.band];
    median.setData(pts.map((p) => ({ time: p.t, value: p.p50 })));
    medianCount = pts.length;
    overlay.band = pts; overlay.refresh();
  },
  setMarkers(list) { markerList = list || []; applyMarkers(); },       // [{time, side, text}]
  setDrawings(list) { drawings = Array.isArray(list) ? list : []; selected = null; pending = null; drawLayer.refresh(); },
  setRanges(list) { overlay.ranges = list || []; overlay.refresh(); },   // [{start, end, high, low, label}]
  setLevels(l) {                              // {side, entry, stop, tp1, tp2, start, end, waiting} or null
    window.fx._levels = l;
    for (const p of priceLines) candles.removePriceLine(p);
    priceLines = [];
    overlay.zones = null;
    if (l) {
      const style = l.waiting ? LW.LineStyle.Dashed : LW.LineStyle.Solid;
      const add = (price, color, title, st) => priceLines.push(candles.createPriceLine({ price, color, title, lineWidth: 2, lineStyle: st, axisLabelVisible: true }));
      add(l.entry, css("--entry"), l.entryLabel || (l.side === "sell" ? "Sell" : "Buy"), style);
      add(l.stop, css("--stop"), l.slLabel || "SL", style);
      add(l.tp1, css("--target"), l.tpLabel || "TP1", style);
      if (l.tp2 && l.tp2 !== l.tp1) add(l.tp2, css("--target"), l.tp2Label || "TP2", LW.LineStyle.Dotted);
      overlay.zones = { start: l.start, end: l.end, entry: l.entry, stop: l.stop, target: l.tp2 || l.tp1 };
    }
    overlay.refresh();
  },
};
candles.attachPrimitive(drawLayer);
window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.fxReady && window.webkit.messageHandlers.fxReady.postMessage("ready");
</script>
</body>
</html>
