e-high)}.chip:active{transform:scale(.95)}.chip.on{background:var(--accent);color:var(--on-accent)}.pill{white-space:nowrap;color:var(--tone,var(--text));background:color-mix(in srgb, var(--tone,var(--text)) 15%, transparent);border-radius:999px;align-items:center;padding:2px 10px;font-size:.74rem;font-weight:600;display:inline-flex}.field{color:var(--text-2);flex-direction:column;gap:4px;min-width:0;font-size:.82rem;display:flex}input,select,textarea{border:1px solid var(--border);background:#00000038;border-radius:12px;outline:none;width:100%;padding:10px 12px;font-size:1rem}input:focus,select:focus,textarea:focus{border-color:var(--accent)}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}textarea{resize:vertical;min-height:96px}.check{cursor:pointer;align-items:center;gap:9px;font-size:.92rem;display:flex}.form-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;display:grid}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.phone-settings{flex:none}@media (width>=820px){.phone-settings{display:none}}.demo-strip{z-index:15;padding:calc(7px + env(safe-area-inset-top)) 16px 7px;text-align:center;color:var(--bg);background:#e4b65a;margin:0 -16px;font-size:.78rem;font-weight:600;position:sticky;top:0}.banner{color:var(--tone,var(--text));background:color-mix(in srgb, var(--tone,var(--text)) 13%, transparent);overflow-wrap:anywhere;border-radius:14px;padding:10px 14px;font-size:.88rem}.empty{color:var(--text-3);padding:6px 0;font-size:.92rem}.dot{background:var(--tone,var(--accent));border-radius:50%;flex:none;width:8px;height:8px;display:inline-block}.dot.live{box-shadow:0 0 0 0 var(--tone,var(--accent));animation:1.5s ease-out infinite pulse}@keyframes pulse{to{box-shadow:0 0 0 9px #0000}}.kz{background:var(--surface);white-space:nowrap;border-radius:999px;align-items:center;gap:9px;height:40px;padding:0 16px;font-size:.82rem;font-weight:600;display:inline-flex}@media (width<=819px){.kz{min-width:0;h w:0 0 0 1px var(--border);animation:rise .3s var(--spring);padding:20px;overflow-y:auto}.modal.wide{width:min(980px,100%)}.modal-head{justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;display:flex}.modal-head h2{font-size:1.15rem;font-weight:600}@media (width<=819px){.modal-back{place-items:end stretch;padding:0}.modal,.modal.wide{border-radius:var(--radius) var(--radius) 0 0;width:100%;max-height:92dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}.chart{height:var(--chart-height,460px);background:var(--chart-bg);touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair;border-radius:18px;position:relative;overflow:hidden}.chart canvas{width:100%;height:100%;position:absolute;inset:0}.chart-tip{pointer-events:none;font-variant-numeric:tabular-nums;background:#0009;border-radius:8px;max-width:calc(100% - 20px);padding:4px 9px;font-size:.74rem;position:absolute;top:10px;left:10px}@media (width<=819px){.chart{height:var(--chart-height-small,380px)}}.signin{place-items:center;min-height:100dvh;padding:16px;display:grid}.signin form{flex-direction:column;gap:14px;width:min(380px,100%);display:flex}.chat{flex-direction:column;gap:8px;display:flex}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;border-radius:16px;max-width:92%;padding:9px 13px;font-size:.92rem}.bubble.user{background:var(--blue);color:#fff;align-self:flex-end}.bubble.assistant{background:var(--chip);align-self:flex-start}@media (prefers-reduced-motion:reduce){*,:before,:after{transition:none!important;animation:none!important}.curve-line{stroke-dashoffset:0}}</style>
<style>
.decision h2{font-size:1.3rem!important;color:var(--tone,var(--text))!important;font-weight:600;margin-bottom:6px!important}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.76rem;color:var(--text-3);margin-top:10px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--tone)}
.alert-item .when{font-size:.74rem;color:var(--text-3)}
.alert-item.unread .title{color:var(--accent)}
.hint{font-size:.8rem;color:var(--text-3)}
.signin .logo{color:var(--accent);font-size:2.2rem;font-weight:700;text-align:center}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.step{background:#ffffff0a;border-radius:12px;padding:8px 10px;font-size:.78rem;color:var(--text-3)}
.step b{display:block;color:var(--text-2);font-size:.82rem}
.step.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text-2)}
.step.on b{color:var(--accent)}
@media (width<=819px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body>
<div id="root"></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f2 = v => v == null || isNaN(v) ? "–" : Number(v).toFixed(2);
const pct = v => v == null ? "–" : (Math.round(v * 1000) / 10) + "%";
const sgn = v => v == null ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(2);
const tone = t => `--tone:var(--${t})`;
const hm = t => new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const dayhm = t => new Date(t * 1000).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"});
const ago = t => { const s = Math.max(0, Date.now() / 1000 - t); return s < 90 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : Math.round(s / 3600) + " h ago"; };
const keep = { get(k, d) { try { const v = localStorage.getItem("obs." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
               set(k, v) { try { localStorage.setItem("obs." + k, JSON.stringify(v)); } catch {} } };
const ICON = {
  today: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/>',
  history: '<path d="M6 3h13v18H6a2 2 0 01-2-2V5a2 2 0 012-2zM9 8h7M9 12h7M9 16h4"/>',
  alerts: '<path d="M6 16V10a6 6 0 1112 0v6l2 2H4zM10 21h4"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
};
const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const PAGES = [{id: "today", label: "Today"}, {id: "history", label: "History"}];

const S = { page: PAGES.some(p => p.id === location.hash.slice(1)) ? location.hash.slice(1) : "today",
            d: null, modal: null, err: null, needPin: false, seen: new Set(keep.get("seen", [])), first: true };

async function api(path, opts = {}) {
  const r = await fetch(path, {credentials: "same-origin", ...opts});
  if (r.status === 401) { S.needPin = true; render(); throw new Error("pin"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
  return j;
}
const post = (p, b) => api(p, {method: "POST", body: JSON.stringify(b || {}), headers: {"Content-Type": "application/json"}});

async function load() {
  try { S.d = await api("/api/state"); S.err = null; S.needPin = false; ping(S.d.alerts || []); }
  catch (e) { if (e.message !== "pin") S.err = "The server can't be reached. Is server.py running?"; }
  render();
}
function ping(alerts) {
  const fresh = alerts.filter(a => !S.seen.has(a.id)); fresh.forEach(a => S.seen.add(a.id)); keep.set("seen", [...S.seen].slice(-300));
  if (S.first) { S.first = false; return; }
  if (!fresh.length) return;
  try { if (Notification.permission === "granted") fresh.slice(0, 3).forEach(a => new Notification("XAUUSD · " + a.title, {body: a.body, tag: a.id})); } catch {}
  try { const C = window.AudioContext || window.webkitAudioContext, c = new C(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = .05; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .2); } catch {}
}

// ------------------------------------------------------------------ shell
function render() {
  const root = $("#root");
  if (S.needPin) { root.innerHTML = pinView(); bindPin(); return; }
  const d = S.d, a = d?.analysis, unread = (d?.alerts || []).some(x => !x.read), y = window.scrollY;
  root.innerHTML = `<div class="shell">
    <aside class="rail"><div class="rail-logo">o</div>
      <div class="rail-group">${PAGES.map(p => `<button class="rail-button ${p.id === S.page ? "on" : ""}" title="${p.label}" aria-label="${p.label}" data-page="${p.id}">${icon(p.id)}</button>`).join("")}</div>
      <div class="rail-space"></div>
      <div class="rail-group"><button class="rail-button" title="Alerts" aria-label="Alerts" data-modal="alerts">${icon("alerts")}${unread ? '<span class="badge"></span>' : ""}</button>
        <button class="rail-button" title="Settings" aria-label="Settings" data-modal="settings">${icon("settings")}</button></div></aside>
    <div class="main">
      ${d?.demo ? '<p class="demo-strip">Demo. Every figure is made up. Not real prices, and not a trade idea.</p>' : ""}
      <header class="topbar"><div class="fill"><h1>${S.page === "today" ? "XAU/USD today" : "History"}</h1>
        <p class="faint tiny tagline">Analysis only. This app never places a trade.</p></div>
        ${a && !a.error ? `<div class="kz"><span class="dot ${a.phase === "open" ? "live" : ""}" style="${tone(a.phase === "open" ? "bull" : "text-3")}"></span>New York ${esc(a.now_et?.slice(11, 16) || "")} ET</div>` : ""}
        <button class="rail-button phone-settings" title="Settings" aria-label="Settings" data-modal="settings">${icon("settings")}</button></header>
      ${S.err ? `<p class="banner" style="${tone("bear")};margin-bottom:16px">${esc(S.err)}</p>` : ""}
      ${d?.status?.error ? `<p class="banner" style="${tone("caution")};margin-bottom:16px">Price feed: ${esc(d.status.error)}</p>` : ""}
      <main>${!d ? '<p class="empty">Loading…</p>' : !a ? '<p class="empty">Reading prices…</p>' : a.error ? `<div class="card"><p class="banner" style="${tone("bear")}">${esc(a.error)}</p></div>` : PAGE[S.page](d, a)}</main>
    </div>
    <nav class="mobile-nav" aria-label="Pages" style="grid-template-columns:repeat(3,1fr)">
      ${PAGES.map(p => `<button class="${p.id === S.page ? "on" : ""}" data-page="${p.id}">${icon(p.id)}${p.label}</button>`).join("")}
      <button data-modal="alerts">${icon("alerts")}${unread ? '<span class="badge"></span>' : ""}Alerts</button></nav>
  </div>${S.modal ? modalView() : ""}`;
  bind(); window.scrollTo(0, y);
  if (S.page === "today" && a && !a.error) drawChart($("#chart"));
}

// ------------------------------------------------------------------ today
function headline(a) {
  const p = a.plan, r = a.range;
  if (p) return {t: p.side === "buy" ? "bull" : "bear", h: `${p.side === "buy" ? "BUY" : "SELL"} at ${f2(p.entry)}`, line: a.reason};
  if (a.status === "expired") return {t: "text-3", h: "No trade today", line: a.reason};
  if (a.phase === "pre-open") return {t: "caution", h: "Before the open", line: `The 9:30 ET open sets a ${(r?.minutes || S.d.settings.or_minutes)}-minute range. Entries from ${a.no_entries_before || "09:45"} ET.`};
  if (a.phase === "forming") return {t: "caution", h: "Range forming", line: a.reason};
  if (a.status === "waiting" && r) return {t: "caution", h: "Watching for a breakout", line: a.reason};
  if (a.status === "no-data" || a.phase === "closed") return {t: "text-3", h: "Market closed", line: a.reason};
  return {t: "caution", h: "Waiting", line: a.reason};
}
function step(a) { return a.plan ? 3 : a.range?.complete ? 2 : a.phase === "forming" ? 1 : 0; }

const PAGE = {};
PAGE.today = (d, a) => {
  const H = headline(a), p = a.plan, z = a.size, o = a.odds, k = d.kronos, cur = esc(d.settings.currency), st = step(a);
  const steps = ["Open 9:30 ET", "Range set", "Breakout", "Manage to " + (p?.flat_by || d.settings.flat_by)];
  const agree = p && k?.ok ? ((k.direction === "up") === (p.side === "buy")) : null;
  return `<div class="grid">
  <div class="span-8 stack">
    <div class="card outlined decision rise" style="${tone(H.t)};--outline:var(--tone)">
      <h2>${esc(H.h)}</h2><p>${esc(H.line)}</p>
      <div class="steps">${steps.map((s, i) => `<div class="step ${i <= st ? "on" : ""}"><b>${i + 1}</b>${esc(s)}</div>`).join("")}</div>
    </div>
    <div class="card rise" style="--order:1"><div class="row spread" style="margin-bottom:10px"><h2 style="margin:0">XAU/USD · 5 min</h2>
      <span class="num strong">${f2(a.chart?.bars?.at(-1)?.c)}</span></div>
      <div class="chart" id="chart" style="--chart-height:440px"><canvas></canvas><div class="chart-tip" hidden></div></div>
      <div class="legend"><span><i style="--tone:#ffffff55"></i>Opening range</span><span><i style="${tone("blue")}"></i>Entry</span><span><i style="${tone("bear")}"></i>Stop</span><span><i style="${tone("bull")}"></i>Target</span>
        ${o ? '<span><i style="--tone:#ccf56166"></i>Time Machine 25–75%</span>' : ""}${k?.ok ? '<span><i style="--tone:#e7a4ff"></i>Kronos</span>' : ""}</div></div>
  </div>
  <div class="span-4 stack">
    <div class="card rise" style="--order:1"><h2>Plan</h2>
      ${p ? `<div class="value-row"><span>Entry (${esc(p.entry_time)} ET)</span><span>${f2(p.entry)}</span></div>
        <div class="value-row"><span>Stop loss</span><span class="bear">${f2(p.stop)}</span></div>
        <div class="value-row"><span>Take profit (${p.target_r}R)</span><span class="bull">${f2(p.target)}</span></div>
        <div class="value-row"><span>Risk per oz</span><span>${f2(p.risk)}</span></div>
        <div class="value-row"><span>Flat by</span><span>${esc(p.flat_by)} ET</span></div>
        <hr class="rule">
        <div class="value-row"><span>Size</span><span class="strong">${z?.lots ? z.lots.toFixed(2) + " lots" : "–"}</span></div>
        <div class="value-row"><span>Loss at stop</span><span>${z?.lots ? f2(z.loss_at_stop) + " " + cur : "–"}</span></div>
        <div class="value-row"><span>Gain at target</span><span>${z?.lots ? f2(z.gain_at_target) + " " + cur : "–"}</span></div>
        ${z?.refusal ? `<p class="tiny caution" style="margin-top:6px">${esc(z.refusal)}</p>` : ""}
        <p class="tiny faint" style="margin-top:8px">${esc(p.stop_label.charAt(0).toUpperCase() + p.stop_label.slice(1))} stop. A stop can fill worse than its price in a fast market.</p>`
      : a.range ? `<div class="value-row"><span>Range high</span><span>${f2(a.range.high)}</span></div><div class="value-row"><span>Range low</span><span>${f2(a.range.low)}</span></div>
        <p class="small muted" style="margin-top:8px">Buy on a 5-minute close above the high, sell on a close below the low, between ${esc(a.no_entries_before)} and ${esc(a.no_entries_after)} ET.</p>`
      : `<p class="small muted">Nothing yet. The plan appears when price breaks the opening range.</p>`}</div>
    <div class="card rise" style="--order:2"><h2>${o ? "Time Machine" : "This rule on past sessions"}</h2>${o ? oddsView(o) : histMini(a.history)}</div>
    <div class="card rise" style="--order:3"><h2>Kronos, next hour</h2>${kronosView(d, agree)}</div>
  </div></div>`;
};
function oddsView(o) {
  return `<div class="value-row"><span>Target first</span><span class="bull">${pct(o.p_target)}</span></div>
    <div class="value-row"><span>Stop first</span><span class="bear">${pct(o.p_stop)}</span></div>
    <div class="value-row"><span>Neither by the close</span><span>${pct(o.p_neither)}</span></div>
    <p class="small" style="margin-top:8px">${esc(o.verdict)}</p>
    ${o.notes.map(n => `<p class="tiny faint">${esc(n)}</p>`).join("")}
    <hr class="rule"><div class="value-row"><span>Past ${o.history.sessions} sessions</span><span>${o.history.triggered} fired: ${o.history.target} target, ${o.history.stop} stop</span></div>
    <p class="tiny faint" style="margin-top:6px">${o.replays.toLocaleString()} replays of the rest of the session from gold's own 5-minute bars. A simulation, not a promise.</p>`;
}
function histMini(h) {
  if (!h || !h.triggered) return '<p class="small muted">Not enough past sessions in the data yet.</p>';
  return `<div class="value-row"><span>Sessions with a breakout</span><span>${h.triggered} of ${h.sessions}</span></div>
    <div class="value-row"><span>Hit the target</span><span class="bull">${h.target} (${pct(h.target / h.triggered)})</span></div>
    <div class="value-row"><span>Hit the stop</span><span class="bear">${h.stop} (${pct(h.stop / h.triggered)})</span></div>
    <div class="value-row"><span>Average</span><span>${sgn(h.avg_R)}R</span></div>
    <p class="tiny faint" style="margin-top:6px">The first breakout each day, either side, replayed to the close.</p>`;
}
function kronosView(d, agree) {
  const k = d.kronos;
  if (!d.settings.kronos) return '<p class="small muted">Off in Settings.</p>';
  if (!k) return `<p class="small muted">${d.kronos_busy ? "Running the model…" : "Waiting for the first forecast."}</p>`;
  if (!k.ok) return `<p class="small muted">${esc(k.why)}</p>`;
  return `<div class="row" style="gap:12px;align-items:baseline"><span class="big num ${k.change >= 0 ? "bull" : "bear"}">${sgn(k.change)}</span><span class="muted small">to ${f2(k.end)} by ${hm(k.path.at(-1).t + 300)}</span></div>
    ${agree == null ? "" : `<p class="small" style="margin-top:6px"><span class="pill" style="${tone(agree ? "bull" : "caution")}">${agree ? "Agrees" : "Disagrees"}</span> with today's ${S.d.analysis.plan.side}.</p>`}
    <p class="tiny faint" style="margin-top:8px">Kronos-small, from the last 400 five-minute bars, average of 5 samples. Updated ${ago(k.from_t + 300)}.</p>`;
}

// ------------------------------------------------------------------ chart
function drawChart(box) {
  if (!box) return;
  const cv = box.querySelector("canvas"), tip = box.querySelector(".chart-tip");
  const a = S.d.analysis, ch = a.chart || {}, bars = ch.bars || [], k = S.d.kronos?.ok ? S.d.kronos.path : [], o = a.odds, p = a.plan;
  if (!bars.length) return;
  const t0 = bars[0].t, step = 300;
  let tEnd = bars.at(-1).t + step;
  const bandT = o && ch.entry_t ? o.bands.map((_, j) => ch.entry_t + j * step) : [];
  if (k.length) tEnd = Math.max(tEnd, k.at(-1).t + step);
  if (bandT.length) tEnd = Math.max(tEnd, Math.min(bandT.at(-1), bars.at(-1).t + 36 * step));
  function paint(hover) {
    const W = box.clientWidth, H = box.clientHeight, dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr; const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const padR = 64, padB = 22, pw = W - padR, ph = H - padB, n = (tEnd - t0) / step;
    const X = t => ((t - t0) / step + .5) / n * pw;
    let lo = Math.min(...bars.map(b => b.l)), hi = Math.max(...bars.map(b => b.h));
    [a.range?.high, a.range?.low, p?.stop, p?.target, ...k.map(c => c.c)].forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
    if (o) o.bands.forEach((b, j) => { if (bandT[j] <= tEnd) { lo = Math.min(lo, b[1]); hi = Math.max(hi, b[3]); } });
    const pad = (hi - lo) * .06 || 1; lo -= pad; hi += pad;
    const Y = v => (hi - v) / (hi - lo) * ph, cw = pw / n;
    g.font = "11px ui-rounded,-apple-system,sans-serif";
    const sp = nice((hi - lo) / 6); g.strokeStyle = "#ffffff0d"; g.fillStyle = "#8f8f8f"; g.textBaseline = "middle";
    for (let v = Math.ceil(lo / sp) * sp; v < hi; v += sp) { g.beginPath(); g.moveTo(0, Y(v)); g.lineTo(pw, Y(v)); g.stroke(); g.fillText(v.toFixed(sp < 1 ? 2 : 0), pw + 8, Y(v)); }
    g.textBaseline = "alphabetic";
    for (let t = Math.ceil(t0 / 3600) * 3600; t < tEnd; t += 3600) { const x = X(t) - cw / 2; if (x > 20 && x < pw - 30) g.fillText(hm(t), x - 16, H - 5); }
    // opening range box
    if (a.range && ch.open_t) { const x1 = X(ch.open_t) - cw / 2, x2 = Math.min(pw, X(ch.range_end_t) - cw / 2);
      g.fillStyle = "#ffffff12"; g.fillRect(x1, Y(a.range.high), x2 - x1, Y(a.range.low) - Y(a.range.high));
      g.setLineDash([5, 5]); g.strokeStyle = "#ffffff55"; [a.range.high, a.range.low].forEach(v => { g.beginPath(); g.moveTo(x1, Y(v)); g.lineTo(pw, Y(v)); g.stroke(); }); g.setLineDash([]);
      g.fillStyle = "#b8b8b8"; g.fillText("Range high", x1 + 4, Y(a.range.high) - 5); g.fillText("Range low", x1 + 4, Y(a.range.low) + 14); }
    // time machine band
    if (o && bandT.length) { g.fillStyle = "#ccf56126"; g.beginPath(); bandT.forEach((t, j) => g.lineTo(X(t), Y(o.bands[j][3]))); for (let j = bandT.length - 1; j >= 0; j--) g.lineTo(X(bandT[j]), Y(o.bands[j][1])); g.fill();
      g.strokeStyle = "#ccf56199"; g.setLineDash([3, 4]); g.beginPath(); bandT.forEach((t, j) => g.lineTo(X(t), Y(o.bands[j][2]))); g.stroke(); g.setLineDash([]); }
    // candles
    bars.forEach(b => { const x = X(b.t), up = b.c >= b.o; g.strokeStyle = g.fillStyle = up ? "#3fcf8e" : "#f25c4d";
      g.beginPath(); g.moveTo(x, Y(b.h)); g.lineTo(x, Y(b.l)); g.stroke(); const bw = Math.max(1, cw * .62), y1 = Y(Math.max(b.o, b.c)), y2 = Y(Math.min(b.o, b.c)); g.fillRect(x - bw / 2, y1, bw, Math.max(1, y2 - y1)); });
    // kronos path
    if (k.length) { g.strokeStyle = "#e7a4ff"; g.lineWidth = 2; g.beginPath(); g.moveTo(X(bars.at(-1).t), Y(bars.at(-1).c)); k.forEach(c => g.lineTo(X(c.t), Y(c.c))); g.stroke(); g.lineWidth = 1; }
    // plan lines
    if (p) { const sx = ch.entry_t ? X(ch.entry_t) - cw / 2 : 0;
      [["Entry", p.entry, "#4a63e8", "#fff"], ["Stop", p.stop, "#f25c4d", "#fff"], ["Target", p.target, "#ccf561", "#171917"]].forEach(([nm, v, col, fg]) => {
        const y = Y(v); g.strokeStyle = col; g.setLineDash([6, 4]); g.beginPath(); g.moveTo(sx, y); g.lineTo(pw, y); g.stroke(); g.setLineDash([]);
        g.fillStyle = col; g.fillRect(pw + 2, y - 9, padR - 4, 18); g.fillStyle = fg; g.textBaseline = "middle"; g.fillText(f2(v), pw + 6, y); g.textBaseline = "alphabetic"; g.fillStyle = col; g.fillText(nm, sx + 4, y - 5); }); }
    // last price
    const lp = bars.at(-1).c, ly = Y(lp); g.fillStyle = "#ffffff"; g.fillRect(pw + 2, ly - 9, padR - 4, 18); g.fillStyle = "#171917"; g.textBaseline = "middle"; g.fillText(f2(lp), pw + 6, ly); g.textBaseline = "alphabetic";
    if (hover) { g.strokeStyle = "#ffffff33"; g.beginPath(); g.moveTo(hover.x, 0); g.lineTo(hover.x, ph); g.stroke();
      const t = t0 + Math.round(hover.x / pw * n - .5) * step, b = bars.find(x => x.t === t), kk = k.find(x => x.t === t);
      tip.hidden = !(b || kk); if (b) tip.textContent = `${hm(t)}  O ${f2(b.o)}  H ${f2(b.h)}  L ${f2(b.l)}  C ${f2(b.c)}`; else if (kk) tip.textContent = `${hm(t)}  Kronos ${f2(kk.c)}`; }
    else tip.hidden = true;
  }
  paint();
  box.onpointermove = e => { const r = box.getBoundingClientRect(); paint({x: e.clientX - r.left}); };
  box.onpointerleave = () => paint();
  window.onresize = () => paint();
}
function nice(x) { const p = Math.pow(10, Math.floor(Math.log10(x))), m = x / p; return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p; }

// ---------------------------------------------------------------- history
PAGE.history = (d, a) => {
  const h = a.history;
  if (!h) return '<div class="card"><p class="empty">Not enough past sessions in the data yet.</p></div>';
  const card = (t, v, sub, i) => `<div class="card span-3 rise" style="--order:${i}"><h2>${t}</h2><div class="big num">${v}</div><p class="small faint">${sub}</p></div>`;
  return `<div class="stack"><div class="grid">
    ${card("Breakouts", `${h.triggered} / ${h.sessions}`, "sessions with an entry", 0)}
    ${card("Target first", pct(h.triggered ? h.target / h.triggered : null), `${h.target} trades`, 1)}
    ${card("Stop first", pct(h.triggered ? h.stop / h.triggered : null), `${h.stop} trades`, 2)}
    ${card("Net", sgn(h.net_R) + "R", `average ${sgn(h.avg_R)}R a trade`, 3)}</div>
    <div class="card rise" style="--order:4"><h2>Every past session (trader-timemachine's history replay)</h2><div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Entry (ET)</th><th>Side</th><th>Entry</th><th>Stop</th><th>Target</th><th>Result</th><th>R</th></tr></thead>
      <tbody>${h.trades.map(t => `<tr><td>${esc(t.date)}</td><td>${esc(t.time)}</td><td class="${t.side === "buy" ? "bull" : "bear"}">${t.side === "buy" ? "Buy" : "Sell"}</td>
        <td>${f2(t.entry)}</td><td>${f2(t.stop)}</td><td>${f2(t.target)}</td><td>${{target: "Target", stop: "Stop", close: "At the close"}[t.outcome]}</td>
        <td class="${t.R > 0 ? "bull" : t.R < 0 ? "bear" : ""}">${sgn(t.R)}</td></tr>`).join("")}</tbody></table></div>
      <p class="tiny faint" style="margin-top:10px">Buys: ${h.by_side.buy.triggered} fired, ${h.by_side.buy.target} target. Sells: ${h.by_side.sell.triggered} fired, ${h.by_side.sell.target} target. A stop and target in the same bar count as the stop. No spread or commission.</p></div></div>`;
};

// ----------------------------------------------------------------- modals
function modalView() {
  const t = S.modal === "alerts" ? "Alerts" : "Settings";
  return `<div class="modal-back" data-close="1"><div class="modal wide" role="dialog" aria-label="${t}">
    <div class="modal-head"><h2>${t}</h2><button class="btn mini" data-close="1">Close</button></div>${S.modal === "alerts" ? alertsView() : settingsView()}</div></div>`;
}
function alertsView() {
  const A = S.d?.alerts || [], perm = "Notification" in window ? Notification.permission : "unsupported", tg = !!S.d?.settings?.telegram_token;
  return `<div class="stack"><div class="row wrapping">
      ${perm === "default" ? '<button class="btn primary mini" data-act="perm">Allow browser notifications</button>' : `<span class="pill" style="${tone(perm === "granted" ? "bull" : "caution")}">Browser: ${perm}</span>`}
      <span class="pill" style="${tone(tg ? "bull" : "caution")}">Telegram: ${tg ? "on" : "not set up"}</span><span class="fill"></span>
      <button class="btn mini" data-act="test">Send a test</button></div>
    <p class="hint">You get: the opening range, the entry (with stop, target, size and odds), then the stop, the target and flat-by-close from trader-alerts.</p>
    <div>${A.length ? A.map(a => `<div class="item alert-item ${a.read ? "" : "unread"}"><div class="row spread"><span class="strong title">${esc(a.title)}</span><span class="when">${dayhm(a.t)}</span></div>
      <p class="small muted" style="white-space:pre-wrap">${esc(a.body)}</p>${a.sent ? `<p class="tiny faint">Telegram: ${esc(a.sent)}</p>` : ""}</div>`).join("") : '<p class="empty">No alerts yet.</p>'}</div></div>`;
}
function settingsView() {
  const s = S.d?.settings || {};
  const inp = (n, l, type = "text", extra = "") => `<label class="field">${l}<input name="${n}" type="${type}" value="${esc(s[n])}" ${extra}></label>`;
  return `<form id="setf" class="stack">
    <div class="card tight"><h2>Account</h2><div class="form-grid">
      ${inp("balance", "Balance", "number", 'step="0.01"')}${inp("currency", "Currency")}${inp("risk_pct", "Max loss per trade %", "number", 'step="0.1"')}${inp("leverage", "Leverage", "number")}</div>
      <p class="hint">trader-budget sizes to your max loss: lots = (balance × risk %) ÷ (stop distance × 100 oz).</p></div>
    <div class="card tight"><h2>The rule (day-trader-skill)</h2><div class="form-grid">
      ${inp("or_minutes", "Opening range (min)", "number", 'step="5" min="5"')}
      <label class="field">Stop<select name="stop_rule"><option value="or_mid" ${s.stop_rule === "or_mid" ? "selected" : ""}>Range midpoint</option><option value="or_far" ${s.stop_rule === "or_far" ? "selected" : ""}>Far side of the range</option></select></label>
      ${inp("target_r", "Target (R)", "number", 'step="0.5"')}${inp("no_entries_before", "No entries before (ET)")}${inp("no_entries_after", "No entries after (ET)")}${inp("flat_by", "Flat by (ET)")}</div></div>
    <div class="card tight"><h2>Data and forecast</h2><div class="form-grid">
      <label class="field">Gold symbol (Yahoo)<select name="symbol"><option value="GC=F" ${s.symbol === "GC=F" ? "selected" : ""}>GC=F, gold futures</option><option value="XAUUSD=X" ${s.symbol === "XAUUSD=X" ? "selected" : ""}>XAUUSD=X, spot</option></select></label>
      <label class="field">Kronos forecast<select name="kronos"><option value="1" ${s.kronos ? "selected" : ""}>On</option><option value="" ${!s.kronos ? "selected" : ""}>Off</option></select></label></div>
      <p class="hint">Futures trade a few dollars above spot. Check levels against your broker before you act.</p></div>
    <div class="card tight"><h2>Telegram</h2><p class="hint">Make a bot with @BotFather and paste its token. Send the bot a message, then paste your chat id from @userinfobot.</p><div class="form-grid">
      ${inp("telegram_token", "Bot token", "text", 'autocomplete="off" placeholder="123456:ABC…"')}${inp("telegram_chat_id", "Chat id")}</div></div>
    <div class="row"><button class="btn primary" type="submit">Save</button><span id="saved" class="small faint"></span></div>
    <p class="src">Tools from ${esc(S.d?.day_trader || "day-trader-skill (not found)")}</p></form>`;
}
function pinView() { return `<main class="signin"><form id="pinf"><div class="logo">o</div><h1 style="text-align:center;font-size:1.3rem">OBSIDIAN Gold</h1>
  <label class="field">PIN<input name="pin" type="password" inputmode="numeric" autofocus></label><button class="btn primary" type="submit">Enter</button><p id="pinerr" class="small bear"></p></form></main>`; }
function bindPin() { $("#pinf").onsubmit = async e => { e.preventDefault(); const r = await fetch("/api/login", {method: "POST", body: JSON.stringify({pin: e.target.pin.value})}); if (r.ok) { S.needPin = false; load(); } else $("#pinerr").textContent = "That PIN is not right."; }; }

function bind() {
  document.querySelectorAll("[data-page]").forEach(b => b.onclick = () => { S.page = b.dataset.page; location.hash = S.page; render(); window.scrollTo(0, 0); });
  document.querySelectorAll("[data-modal]").forEach(b => b.onclick = () => { S.modal = b.dataset.modal; render(); if (S.modal === "alerts") post("/api/alerts/read").catch(() => {}); });
  document.querySelectorAll("[data-close]").forEach(b => b.onclick = e => { if (e.target === b) { S.modal = null; load(); } });
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => ACT[b.dataset.act]());
  const f = $("#setf"); if (f) f.onsubmit = async e => { e.preventDefault(); const p = Object.fromEntries(new FormData(f).entries());
    p.kronos = !!p.kronos; try { await post("/api/settings", p); $("#saved").textContent = "Saved. Reading prices again…"; setTimeout(load, 2500); } catch (err) { $("#saved").textContent = err.message; } };
}
const ACT = {
  perm: async () => { try { await Notification.requestPermission(); } catch {} render(); },
  test: async () => { await post("/api/test-alert").catch(() => {}); load(); },
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.modal) { S.modal = null; load(); } });
load();
setInterval(() => { if (!S.modal && !document.hidden) load(); }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
