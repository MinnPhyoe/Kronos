e-high)}.chip:active{transform:scale(.95)}.chip.on{background:var(--accent);color:var(--on-accent)}.pill{white-space:nowrap;color:var(--tone,var(--text));background:color-mix(in srgb, var(--tone,var(--text)) 15%, transparent);border-radius:999px;align-items:center;padding:2px 10px;font-size:.74rem;font-weight:600;display:inline-flex}.field{color:var(--text-2);flex-direction:column;gap:4px;min-width:0;font-size:.82rem;display:flex}input,select,textarea{border:1px solid var(--border);background:#00000038;border-radius:12px;outline:none;width:100%;padding:10px 12px;font-size:1rem}input:focus,select:focus,textarea:focus{border-color:var(--accent)}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}textarea{resize:vertical;min-height:96px}.check{cursor:pointer;align-items:center;gap:9px;font-size:.92rem;display:flex}.form-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;display:grid}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.phone-settings{flex:none}@media (width>=820px){.phone-settings{display:none}}.demo-strip{z-index:15;padding:calc(7px + env(safe-area-inset-top)) 16px 7px;text-align:center;color:var(--bg);background:#e4b65a;margin:0 -16px;font-size:.78rem;font-weight:600;position:sticky;top:0}.banner{color:var(--tone,var(--text));background:color-mix(in srgb, var(--tone,var(--text)) 13%, transparent);overflow-wrap:anywhere;border-radius:14px;padding:10px 14px;font-size:.88rem}.empty{color:var(--text-3);padding:6px 0;font-size:.92rem}.dot{background:var(--tone,var(--accent));border-radius:50%;flex:none;width:8px;height:8px;display:inline-block}.dot.live{box-shadow:0 0 0 0 var(--tone,var(--accent));animation:1.5s ease-out infinite pulse}@keyframes pulse{to{box-shadow:0 0 0 9px #0000}}.kz{background:var(--surface);white-space:nowrap;border-radius:999px;align-items:center;gap:9px;height:40px;padding:0 16px;font-size:.82rem;font-weight:600;display:inline-flex}@media (width<=819px){.kz{min-width:0;h w:0 0 0 1px var(--border);animation:rise .3s var(--spring);padding:20px;overflow-y:auto}.modal.wide{width:min(980px,100%)}.modal-head{justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;display:flex}.modal-head h2{font-size:1.15rem;font-weight:600}@media (width<=819px){.modal-back{place-items:end stretch;padding:0}.modal,.modal.wide{border-radius:var(--radius) var(--radius) 0 0;width:100%;max-height:92dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}.chart{height:var(--chart-height,460px);background:var(--chart-bg);touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair;border-radius:18px;position:relative;overflow:hidden}.chart canvas{width:100%;height:100%;position:absolute;inset:0}.chart-tip{pointer-events:none;font-variant-numeric:tabular-nums;background:#0009;border-radius:8px;max-width:calc(100% - 20px);padding:4px 9px;font-size:.74rem;position:absolute;top:10px;left:10px}@media (width<=819px){.chart{height:var(--chart-height-small,380px)}}.signin{place-items:center;min-height:100dvh;padding:16px;display:grid}.signin form{flex-direction:column;gap:14px;width:min(380px,100%);display:flex}.chat{flex-direction:column;gap:8px;display:flex}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;border-radius:16px;max-width:92%;padding:9px 13px;font-size:.92rem}.bubble.user{background:var(--blue);color:#fff;align-self:flex-end}.bubble.assistant{background:var(--chip);align-self:flex-start}@media (prefers-reduced-motion:reduce){*,:before,:after{transition:none!important;animation:none!important}.curve-line{stroke-dashoffset:0}}</style>
<style>
.price-up{color:var(--bull)}.price-down{color:var(--bear)}
.decision h2{font-size:1.15rem!important;color:var(--tone,var(--text))!important;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.76rem;color:var(--text-3)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--tone)}
.cone-note{font-size:.78rem;color:var(--text-3)}

.signin .logo{color:var(--accent);font-size:2.2rem;font-weight:700;text-align:center}
.timebar{position:relative;height:30px;border-radius:10px;background:#ffffff0a;overflow:hidden}
.timebar span{white-space:nowrap;overflow:hidden;position:absolute;top:0;bottom:0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:600;color:var(--on-accent)}

<body>
<div id="root"></div>
<script>
"use strict";
// ---------------------------------------------------------------- helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f2 = v => v == null || isNaN(v) ? "–" : Number(v).toFixed(2);
const pct = v => v == null ? "–" : Math.round(v * 100) + "%";
const sgn = v => v == null ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(2);
const tone = t => `--tone:var(--${t})`;
const local = t => new Date(t * 1000);
const hm = t => local(t).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const dayhm = t => local(t).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"});
const ago = t => { const s = Math.max(0, Date.now() / 1000 - t); return s < 90 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };
const store = { get(k, d) { try { const v = localStorage.getItem("obs." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("obs." + k, JSON.stringify(v)); } catch {} } };

const ICON = {
  dashboard: '<path d="M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/>',
  chart: '<path d="M5 21v-7M12 21V4M19 21v-11"/>',
  signal: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/>',
  rules: '<path d="M4 4h5v17H4zM9 4h5v17H9zM15 5l4-1 3 16-4 1z"/>',
  history: '<path d="M6 3h13v18H6a2 2 0 01-2-2V5a2 2 0 012-2zM9 8h7M9 12h7M9 16h4"/>',
  alerts: '<path d="M6 16V10a6 6 0 1112 0v6l2 2H4zM10 21h4"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
};
const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const PAGES = [{id: "dashboard", label: "Dashboard"}, {id: "chart", label: "Chart"}, {id: "signal", label: "Signal"},
               {id: "history", label: "History"}, {id: "rules", label: "Rules"}];

// ------------------------------------------------------------------ state
const S = { page: PAGES.some(p => p.id === location.hash.slice(1)) ? location.hash.slice(1) : "dashboard",
            tf: store.get("tf", "M15"), data: null, modal: null, err: null, needPin: false,
            layers: store.get("layers", {ema20: true, ema50: true, levels: true, forecast: true, signals: true, kronos: true}),
            seenAlerts: new Set(store.get("seen", [])), firstLoad: true, busy: false };

async function api(path, opts = {}) {
  const r = await fetch(path, {credentials: "same-origin", ...opts});
  if (r.status === 401) { S.needPin = true; render(); throw new Error("pin"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
const post = (path, body, raw) => api(path, {method: "POST", body: raw ? body : JSON.stringify(body || {}),
                                              headers: raw ? {"Content-Type": "text/plain"} : {"Content-Type": "application/json"}});

async function load() {
  try {
    const d = await api("/api/state?tf=" + S.tf);
    S.data = d; S.err = null; S.needPin = false;
    notifyNew(d.alerts || []);
  } catch (e) { if (e.message !== "pin") S.err = "The app's server could not be reached. Is server.py running?"; }
  render();
}
function notifyNew(alerts) {
  const fresh = alerts.filter(a => !S.seenAlerts.has(a.id));
  fresh.forEach(a => S.seenAlerts.add(a.id));
  store.set("seen", [...S.seenAlerts].slice(-300));
  if (S.firstLoad) { S.firstLoad = false; return; }
  if (!fresh.length) return;
  try {
    if ("Notification" in window && Notification.permission === "granted")
      fresh.slice(0, 3).forEach(a => new Notification("OBSIDIAN Gold: " + a.title, {body: a.body, tag: a.id}));
  } catch {}
  try { beep(); } catch {}
}
function beep() {
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  const c = new C(), o = c.createOscillator(), g = c.createGain();
  o.frequency.value = 880; g.gain.value = .05; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .18);
}

// ----------------------------------------------------------------- shell
function render() {
  const root = $("#root");
  if (S.needPin) { root.innerHTML = pinView(); bindPin(); return; }
  const d = S.data, a = d?.analysis, unread = (d?.alerts || []).some(x => !x.read);
  const title = S.page === "dashboard" ? greet() : PAGES.find(p => p.id === S.page).label;
  const demo = d?.status?.source === "demo";
  const scrollY = window.scrollY;
  root.innerHTML = `
  <div class="shell">
    <aside class="rail">
      <div class="rail-logo">o</div>
      <div class="rail-group">${PAGES.map(p => `<button class="rail-button ${p.id === S.page ? "on" : ""}" title="${p.label}" aria-label="${p.label}" data-page="${p.id}">${icon(p.id)}</button>`).join("")}</div>
      <div class="rail-space"></div>
      <div class="rail-group">
        <button class="rail-button" title="Alerts" aria-label="Alerts" data-modal="alerts">${icon("alerts")}${unread ? '<span class="badge"></span>' : ""}</button>
        <button class="rail-button" title="Settings" aria-label="Settings" data-modal="settings">${icon("settings")}</button>
      </div>
    </aside>
    <div class="main">
      ${demo ? '<p class="demo-strip">Demo. Every figure is made up. Not real prices, and not a trade idea.</p>' : ""}
      <header class="topbar">
        <div class="fill"><h1>${title}</h1><p class="faint tiny tagline">XAU/USD only. Analysis only. This app never places a trade.</p></div>
        ${clockPill(a)}
        <button class="rail-button phone-settings" title="Settings" aria-label="Settings" data-modal="settings">${icon("settings")}</button>
      </header>
      ${S.err ? `<p class="banner" style="${tone("bear")};margin-bottom:16px">${esc(S.err)}</p>` : ""}
      ${d?.status?.error ? `<p class="banner" style="${tone("caution")};margin-bottom:16px">Price feed: ${esc(d.status.error)}. ${d.status.ok ? "Showing the last candles it had." : "Upload a CSV in Settings, or change the source."}</p>` : ""}
      <main>${!d ? '<p class="empty">Loading…</p>' : !a?.ok ? emptyView(a) : PAGE[S.page]()}</main>
    </div>
    <nav class="mobile-nav" aria-label="Pages">
      ${PAGES.map(p => `<button class="${p.id === S.page ? "on" : ""}" data-page="${p.id}">${icon(p.id)}${p.label}</button>`).join("")}
      <button data-modal="alerts">${icon("alerts")}${unread ? '<span class="badge"></span>' : ""}Alerts</button>
    </nav>
  </div>
  ${S.modal ? modalView() : ""}`;
  bind();
  window.scrollTo(0, scrollY);
  if (S.page === "chart" && a?.ok) drawChart($("#chart"), {big: true});
  if (S.page === "signal" && a?.ok) drawChart($("#chart"), {big: false});
}
function greet() { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; }
function clockPill(a) {
  const c = a?.clock; if (!c) return "";
  const live = c.trade_window;
  const txt = live ? `${c.current} window is open` : c.next ? `Next window: ${c.next} at ${hm(c.next_t)}` : (c.current ? c.current + " session" : "Market quiet");
  return `<div class="kz"><span class="dot ${live ? "live" : ""}" style="${tone(live ? "bull" : "text-3")}"></span>${txt}</div>`;
}
function emptyView(a) {
  return `<div class="card tight"><h2>No analysis yet</h2><p class="muted">${esc(a?.why || "Waiting for candles.")}</p>
    <p class="small faint">Check the price source in Settings, or upload an XAUUSD export from MT5 (M1, M5 or M15).</p>
    <div class="row"><button class="btn primary" data-modal="settings">Open settings</button><button class="btn" data-act="refresh">Try again</button></div></div>`;
}

// ------------------------------------------------------------- dashboard
function decision(a) {
  const s = a.signal;
  if (s) {
    const buy = s.side === "buy";
    return {tone: buy ? "bull" : "bear", head: `${buy ? "BUY" : "SELL"} signal is live`,
            line: `${s.kind} in ${s.session}. Entry ${f2(s.entry)}, stop ${f2(s.stop)}, target ${f2(s.tp2)}.`};

      g.beginPath(); if (buy) { g.moveTo(X(i), y - 7); g.lineTo(X(i) - 5, y + 2); g.lineTo(X(i) + 5, y + 2); } else { g.moveTo(X(i), y + 7); g.lineTo(X(i) - 5, y - 2); g.lineTo(X(i) + 5, y - 2); } g.fill(); });
    // last price tag
    const ly = Y(a.price); g.fillStyle = "#ccf561"; g.fillRect(plotW + 2, ly - 9, padR - 4, 18); g.fillStyle = "#171917"; g.textBaseline = "middle"; g.fillText(f2(a.price), plotW + 6, ly); g.textBaseline = "alphabetic";
    // crosshair
    if (hover) { const i = Math.round(hover.x / cw - .5 + startIdx); g.strokeStyle = "#ffffff33"; g.beginPath(); g.moveTo(hover.x, 0); g.lineTo(hover.x, plotH); g.moveTo(0, hover.y); g.lineTo(plotW, hover.y); g.stroke();
      if (i >= 0 && i < cs.length) { const c = cs[i]; tip.hidden = false; tip.textContent = `${dayhm(c.t)}  O ${f2(c.o)}  H ${f2(c.h)}  L ${f2(c.l)}  C ${f2(c.c)}`; }
      else if (showFc && i >= cs.length) { const j = Math.min(a.projection.cone.length - 1, (i - cs.length)); const c = a.projection.cone[j]; tip.hidden = false; tip.textContent = `${hm(c.t)} forecast: middle ${f2(c.p50)}, 50% range ${f2(c.p25)}–${f2(c.p75)}`; }
      else tip.hidden = true; } else tip.hidden = true;
    paint.cw = cw;
  }
  paint();
  let drag = null, pinch = null;
  box.onpointerdown = e => { drag = {x: e.clientX, end: VIEW.end}; box.setPointerCapture(e.pointerId); };
  box.onpointermove = e => { const r = box.getBoundingClientRect();
    if (drag && e.buttons) { VIEW.end = Math.max(-5, Math.min(cs.length - 30, drag.end + Math.round((e.clientX - drag.x) / (paint.cw || 6)))); paint(); }
    else paint({x: e.clientX - r.left, y: e.clientY - r.top}); };
  box.onpointerup = () => { drag = null; }; box.onpointerleave = () => { drag = null; paint(); };
  box.onwheel = e => { e.preventDefault(); VIEW.span = Math.max(30, Math.min(600, Math.round(VIEW.span * (e.deltaY > 0 ? 1.12 : .89)))); store.set("span", VIEW.span); paint(); };
  box.ontouchstart = e => { if (e.touches.length === 2) pinch = {d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), span: VIEW.span}; };
  box.ontouchmove = e => { if (pinch && e.touches.length === 2) { const dd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); VIEW.span = Math.max(30, Math.min(600, Math.round(pinch.span * pinch.d / dd))); paint(); } };
  box.ontouchend = () => { pinch = null; };
  window.onresize = () => paint();
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))), n = x / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }

// ---------------------------------------------------------------- signal
PAGE.signal = () => {

  const passed = a.checks.filter(c => c.ok).length;
  return `<div class="grid">
    <div class="span-8 stack">
      <div class="card"><div class="row spread" style="margin-bottom:10px"><h2 style="margin:0">XAU/USD M15</h2><div class="row"><span class="num">${f2(a.price)}</span><span class="pill" style="${tone("bull")}">${esc(srcLabel(d.status))}</span></div></div>
        <div class="chart" id="chart" style="--chart-height:440px"><canvas></canvas><div class="chart-tip" hidden></div></div>${legend()}</div>
      <div class="grid">
        <div class="card span-6"><h2>Plan</h2>${s ? planRows(s, d) : `
          <div class="value-row"><span>Direction</span><span>${biasPill(a.bias.dir)}</span></div>
          <p class="small muted" style="margin-top:8px">No live signal. When one fires, the entry, stop, both targets and your lot size appear here and an alert goes out.</p>`}</div>
        <div class="card span-6"><h2>Checks, latest candle</h2><p class="small muted" style="margin-bottom:6px">${passed} of ${a.checks.length} passed</p>
          ${a.checks.map(c => `<div class="item row spread" style="align-items:flex-start"><div class="tight" style="gap:2px"><span class="small">${esc(c.q)}</span><span class="tiny faint">${esc(c.detail)}</span></div>
            <span class="pill" style="${tone(c.ok ? "bull" : "caution")}">${c.ok ? "Passed" : "Not yet"}</span></div>`).join("")}</div>
      </div>
    </div>
    <div class="span-4 stack">
      <div class="card outlined decision" style="${tone(dec.tone)};--outline:var(--tone)">
        <h2>${esc(dec.head)}</h2><p style="margin-bottom:10px">${esc(dec.line)}</p>
        <div class="value-row"><span>H1 trend</span><span>${biasPill(a.bias.h1)}</span></div>
        <div class="value-row"><span>H4 trend</span><span>${biasPill(a.bias.h4)}</span></div>
        <div class="value-row"><span>RSI 14 (M15)</span><span>${a.rsi ?? "–"}</span></div>
        <div class="value-row"><span>ATR 14 (M15)</span><span>${f2(a.atr)}</span></div>
        <p class="tiny faint" style="margin-top:8px">${esc(a.bias.why)}</p>
      </div>
      <div class="card"><h2>${s ? "Odds for this plan" : "Forecast, next 4 hours"}</h2>
        ${s && pr?.plan_odds ? `<div class="row" style="gap:16px">${ring(pr.plan_odds.tp2_first, pct(pr.plan_odds.tp2_first))}
          <div class="fill"><div class="value-row"><span>Target 2 first</span><span>${pct(pr.plan_odds.tp2_first)}</span></div>
          <div class="value-row"><span>Stop first</span><span>${pct(pr.plan_odds.stop_first)}</span></div>
          <div class="value-row"><span>Neither in 4 h</span><span>${pct(pr.plan_odds.neither)}</span></div></div></div>
          <p class="tiny faint" style="margin-top:8px">${pr.paths.toLocaleString()} replays of the next 4 hours from gold's own candles at this time of day.</p>` : projSummary(a)}
        <hr class="rule"><div class="value-row"><span>Same setup in the past</span><span>${s ? pct(a.stats[s.kind].win_rate) + " of " + a.stats[s.kind].trades : pct(a.stats.all.win_rate) + " of " + a.stats.all.trades}</span></div>
      </div>
      <div class="card"><h2>Kronos AI forecast</h2>
        ${d.kronos?.ok ? `<p class="small">Kronos-small's path ends at <span class="strong">${f2(d.kronos.candles.at(-1).c)}</span> in 4 hours (${sgn(d.kronos.candles.at(-1).c - d.kronos.from)}). Made ${ago(d.kronos.made)}.</p>`
          : d.kronos ? `<p class="small muted">${esc(d.kronos.why || d.kronos.error)}</p>` : `<p class="small muted">A second opinion from the Kronos model. Needs torch on the server; the first run downloads the model.</p>`}
        <button class="btn" style="margin-top:10px" data-act="kronos" ${S.busy ? "disabled" : ""}>${S.busy ? "Running…" : "Run Kronos"}</button></div>

};
function planRows(s, d) {
  const z = s.size, cur = esc(d.settings.currency);
  return `<div class="value-row"><span>Direction</span><span>${biasPill(s.side === "buy" ? "bullish" : "bearish")}</span></div>

    <div class="value-row"><span>Entry</span><span>${f2(s.entry)}</span></div>
    <div class="value-row"><span>Stop loss</span><span class="bear">${f2(s.stop)} (${f2(s.risk)})</span></div>
    <div class="value-row"><span>Take profit 1</span><span class="bull">${f2(s.tp1)} (1R)</span></div>
    <div class="value-row"><span>Take profit 2</span><span class="bull">${f2(s.tp2)} (2R)</span></div>
    <div class="value-row"><span>Signal at</span><span>${hm(s.t)}</span></div>
    <div class="value-row"><span>Close by</span><span>${hm(s.t + 8 * 3600)}</span></div>
    <hr class="rule">
    <div class="value-row"><span>Lots at ${d.settings.risk_pct}%</span><span class="strong">${z?.lots ? z.lots.toFixed(2) : "–"}</span></div>
    <div class="value-row"><span>Loss at stop</span><span>${z?.lots ? f2(z.loss_at_stop) + " " + cur : "–"}</span></div>
    <div class="value-row"><span>Gain at TP2</span><span>${z?.lots ? f2(z.loss_at_stop * 2) + " " + cur : "–"}</span></div>
    ${z?.note ? `<p class="tiny caution">${esc(z.note)}</p>` : ""}

}

// --------------------------------------------------------------- history
PAGE.history = () => {
  const a = S.data.analysis, H = a.history.slice().reverse(), st = a.stats;
  const cell = k => `<div class="card span-3"><h2>${k}</h2><div class="big num">${pct(st[k].win_rate)}</div><p class="small faint">${st[k].trades} signals · ${sgn(st[k].net_r)}R</p></div>`;
  return `<div class="stack"><div class="grid">${["Breakout", "Pullback", "London", "New York"].map(cell).join("")}</div>
    <div class="card"><h2>Every signal in the loaded candles</h2><div class="table-wrap"><table>
      <thead><tr><th>Time</th><th>Side</th><th>Setup</th><th>Session</th><th>Entry</th><th>Stop</th><th>TP2</th><th>Result</th><th>R</th></tr></thead>
      <tbody>${H.map(h => `<tr><td>${dayhm(h.candle_t)}</td><td class="${h.side === "buy" ? "bull" : "bear"}">${h.side === "buy" ? "Buy" : "Sell"}</td><td>${h.kind}</td><td>${h.session}</td>
        <td>${f2(h.entry)}</td><td>${f2(h.stop)}</td><td>${f2(h.tp2)}</td><td>${{tp2: "Target 2", stop: "Stop", tp1_then_stop: "TP1, then entry", timeout: "Time", open: "Live"}[h.outcome.result]}</td>
        <td class="${(h.outcome.r || 0) > 0 ? "bull" : (h.outcome.r || 0) < 0 ? "bear" : ""}">${h.outcome.r == null ? "–" : sgn(h.outcome.r)}</td></tr>`).join("") || '<tr><td colspan="9" class="faint">No signals yet.</td></tr>'}</tbody></table></div>
      <p class="tiny faint" style="margin-top:10px">Entries at the signal candle's close. Inside a candle the stop is assumed to hit before a target (the cautious reading). No spread or commission included.</p></div></div>`;
};

// ----------------------------------------------------------------- rules
PAGE.rules = () => `<div class="grid">
  <div class="card span-6 stack"><h2>Gold Pulse, the rules</h2>
    <div><p class="strong">1. Trend first</p><p class="small muted">H1 EMA 50 above EMA 200 and the H4 close above its EMA 50 means buys only. Both below means sells only. Mixed means no trades.</p></div>
    <div><p class="strong">2. Trade the busy hours</p><p class="small muted">Signals only count in the London (07:00–11:00 UTC) and New York (12:00–16:00 UTC) windows. Change them in Settings.</p></div>
    <div><p class="strong">3. Two entries on M15</p><p class="small muted"><b>Pullback</b>: a candle dips to the EMA 20 and closes back with the trend, with a rejection wick (close in the outer 40% of the candle) and RSI not stretched (40–65 for buys, 35–60 for sells).<br><b>Breakout</b>: a candle closes beyond the last 20 candles' high or low, with a body of at least 0.6 ATR.</p></div>
    <div><p class="strong">4. Stop and targets</p><p class="small muted">Stop beyond the signal candle and the last 5 candles' swing, plus 0.3 ATR, kept between 0.8 and 3 ATR. Target 1 at 1R (move the stop to entry), Target 2 at 2R. Close anything still open after 8 hours.</p></div>
    <div><p class="strong">5. Size from the stop</p><p class="small muted">Lots = (balance × risk %) ÷ (stop distance × 100 oz). 1 lot of gold moves 100 ${esc(S.data?.settings?.currency || "USD")} per 1.00 of price.</p></div>
  </div>
  <div class="span-6 stack">
    <div class="card"><h2>How the forecast works</h2><p class="small muted">The app replays the next 16 M15 candles 2,000 times. Each candle is drawn from gold's real candles at the same time of day over the last 60 days, scaled to today's volatility. The middle line is the median path; the shaded bands hold 50% and 80% of the replays. With a live signal it counts how often the target came before the stop.</p></div>
    <div class="card"><h2>What it cannot see</h2><p class="small muted">News. CPI, NFP, FOMC and Fed speakers move gold more than any pattern. Stand aside 30 minutes either side of high-impact news. The forecast is built from the past and can't see a surprise.</p></div>
    <div class="card"><h2>Fine print</h2><p class="small muted">Not financial advice. This app does arithmetic on past prices. It never connects to a broker or places a trade. Test it on a demo account for a few weeks before you trust it with money.</p></div>
  </div></div>`;

// ---------------------------------------------------------------- modals

  const t = S.modal === "alerts" ? "Alerts" : "Settings";
  return `<div class="modal-back" data-close="1"><div class="modal wide" role="dialog" aria-label="${t}">

    ${S.modal === "alerts" ? alertsView() : settingsView()}</div></div>`;
}
function alertsView() {
  const A = S.data?.alerts || [], perm = "Notification" in window ? Notification.permission : "unsupported";
  return `<div class="stack">
    <div class="row wrapping">${perm === "default" ? '<button class="btn primary mini" data-act="perm">Allow browser notifications</button>' : `<span class="pill" style="${tone(perm === "granted" ? "bull" : "caution")}">Browser: ${perm}</span>`}
      <span class="pill" style="${tone(S.data?.settings?.telegram_token ? "bull" : "caution")}">Telegram: ${S.data?.settings?.telegram_token ? "connected" : "not set up"}</span>

    <div>${A.length ? A.map(a => `<div class="item alert-item ${a.read ? "" : "unread"}"><div class="row spread"><span class="strong title">${esc(a.title)}</span><span class="when">${dayhm(a.t)}</span></div>

}

      <label class="field">Source<select name="source">${[["yahoo", "Yahoo Finance (free)"], ["binance", "Binance PAXG (24/7)"], ["csv", "My CSV upload"], ["demo", "Demo (made up)"]].map(([v, l]) => `<option value="${v}" ${s.source === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="field">Symbol<input name="symbol" value="${esc(s.symbol)}" placeholder="GC=F or XAUUSD=X"></label>

      <div class="form-grid"><label class="field">Telegram bot token<input name="telegram_token" value="${esc(s.telegram_token)}" placeholder="123456:ABC…" autocomplete="off"></label>
        <label class="field">Telegram chat id<input name="telegram_chat_id" value="${esc(s.telegram_chat_id)}"></label>
        <label class="field">Quiet from (UTC)<input name="quiet.0" value="${esc(s.quiet?.[0])}" placeholder="22:00"></label>
        <label class="field">Quiet to (UTC)<input name="quiet.1" value="${esc(s.quiet?.[1])}" placeholder="06:00"></label></div>
      <div class="row wrapping" style="gap:16px;margin-top:6px">${chk("signal", "New signal")}${chk("tp1", "Target 1")}${chk("tp2", "Target 2")}${chk("stop", "Stop hit")}${chk("timeout", "Time up")}${chk("session", "Session opens")}</div></div>
    <div class="row"><button class="btn primary" type="submit">Save</button><span id="saved" class="small faint"></span></div>
  </form>`;
}

// ----------------------------------------------------------------- pin
function pinView() { return `<main class="signin"><form id="pinf"><div class="logo">o</div><h1 style="text-align:center;font-size:1.3rem">OBSIDIAN Gold</h1>
  <label class="field">PIN<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus></label>
  <button class="btn primary" type="submit">Enter</button><p id="pinerr" class="small bear"></p></form></main>`; }
function bindPin() { $("#pinf").onsubmit = async e => { e.preventDefault(); const r = await fetch("/api/login", {method: "POST", body: JSON.stringify({pin: e.target.pin.value})});
  if (r.ok) { S.needPin = false; load(); } else $("#pinerr").textContent = "That PIN is not right."; }; }

// ---------------------------------------------------------------- events
function bind() {
  document.querySelectorAll("[data-page]").forEach(b => b.onclick = () => { S.page = b.dataset.page; location.hash = S.page; VIEW.end = 0; render(); window.scrollTo(0, 0); });
  document.querySelectorAll("[data-modal]").forEach(b => b.onclick = async () => { S.modal = b.dataset.modal; render(); if (S.modal === "alerts") { await post("/api/alerts/read").catch(() => {}); } });
  document.querySelectorAll("[data-close]").forEach(b => b.onclick = e => { if (e.target === b) { S.modal = null; load(); } });
  document.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => { S.tf = b.dataset.tf; store.set("tf", S.tf); VIEW.end = 0; load(); });
  document.querySelectorAll("[data-layer]").forEach(b => b.onclick = () => { S.layers[b.dataset.layer] = !S.layers[b.dataset.layer]; store.set("layers", S.layers); render(); });
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => ACT[b.dataset.act]());
  const f = $("#setf"); if (f) {
    f.onsubmit = async e => { e.preventDefault(); const p = {}, fd = new FormData(f);
      for (const [k, v] of fd.entries()) { if (k.includes(".")) { const [a, i] = k.split("."); (p[a] = p[a] || ["", ""])[+i] = v.trim(); }
        else p[k] = ["balance", "risk_pct", "max_daily_loss_pct", "tp1_r", "tp2_r", "csv_offset_hours"].includes(k) ? parseFloat(v) : k === "poll_seconds" ? parseInt(v) : v.trim(); }
      p.notify = {}; f.querySelectorAll("[data-n]").forEach(c => p.notify[c.dataset.n] = c.checked);
      try { await post("/api/settings", p); $("#saved").textContent = "Saved. Refreshing prices…"; setTimeout(load, 2500); } catch (err) { $("#saved").textContent = err.message; } };
    $("#csv").onchange = async e => { const file = e.target.files[0]; if (!file) return; $("#saved").textContent = "Reading " + file.name + "…";
      try { const off = f.csv_offset_hours.value || 0; const r = await post("/api/upload?offset=" + encodeURIComponent(off), await file.text(), true);
        $("#saved").textContent = `Loaded ${r.candles.toLocaleString()} M15 candles, ${dayhm(r.from)} to ${dayhm(r.to)}.`; load(); } catch (err) { $("#saved").textContent = err.message; } };
  }
}
const ACT = {
  refresh: async () => { await post("/api/refresh").catch(() => {}); load(); },
  perm: async () => { try { await Notification.requestPermission(); } catch {} render(); },
  test: async () => { await post("/api/test-alert").catch(() => {}); await load(); },
  clear: async () => { if (confirm("Delete every alert?")) { await post("/api/alerts/clear"); load(); } },
  kronos: async () => { S.busy = true; render(); try { await post("/api/kronos"); } catch {} S.busy = false; load(); },
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.modal) { S.modal = null; load(); } });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (PAGES.some(p => p.id === h) && h !== S.page) { S.page = h; render(); } });

load();
setInterval(() => { if (!S.modal && !document.hidden) load(); }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
